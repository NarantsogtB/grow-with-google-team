[pytest]
# asyncio_mode=auto: all async test functions automatically run as async tests
# Without this, you'd need @pytest.mark.asyncio on every async test function.
asyncio_mode = auto

# Test discovery: look in the tests/ directory
testpaths = tests

# Show short traceback format for cleaner output
addopts = -v --tb=short

# Suppress common deprecation warnings from dependencies during test runs
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
